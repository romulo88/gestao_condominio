name: Deploy backend

# Só a main dispara deploy. `paths` evita rebuild quando o commit mexeu só em doc.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Dois deploys ao mesmo tempo na mesma VPS se atropelam (um `compose up` no meio do
# outro). A fila serializa; `cancel-in-progress: false` porque cancelar um deploy pela
# metade é pior que esperar.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/gestao-condominio-backend

jobs:
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Duas tags: `latest` é o que o compose da VPS referencia; a do SHA é o histórico,
      # pra conseguir voltar pra uma versão específica sem rebuildar.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Puxar a imagem nova e recriar o serviço
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Sem o `test -s`, uma VPS fora do ar deixa o known_hosts vazio e o erro que
          # aparece e "Host key verification failed" - que parece problema de chave.
          ssh-keyscan -H "$VPS_HOST" > /tmp/known_hosts_vps
          test -s /tmp/known_hosts_vps || { echo "Nao consegui a host key de $VPS_HOST - VPS fora do ar ou IP errado."; exit 1; }
          cat /tmp/known_hosts_vps >> ~/.ssh/known_hosts

          # O token vai por stdin (--password-stdin), não como argumento: argumento
          # apareceria na lista de processos da VPS. É o GITHUB_TOKEN do próprio run,
          # válido só enquanto o job roda - por isso não precisa de PAT guardado lá.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" "
            set -euo pipefail

            # DOCKER_CONFIG proprio deste deploy: os dois repositorios deployam na mesma
            # VPS com o mesmo usuario, entao um 'docker logout' no config compartilhado
            # derrubaria a sessao do outro deploy no meio do pull.
            export DOCKER_CONFIG=\$(mktemp -d)
            trap 'rm -rf \$DOCKER_CONFIG' EXIT

            docker login ghcr.io -u '$GHCR_USER' --password-stdin

            # flock serializa os dois repositorios entre si: 'compose up' simultaneos no
            # mesmo projeto disputam a criacao de rede/volume.
            flock /tmp/condominio-deploy.lock bash -c '
              cd /opt/condominio
              docker compose pull backend
              docker compose up -d backend
              docker image prune -f
            '

            # Um container pode subir e morrer em seguida. Espera o healthcheck da propria
            # imagem virar healthy antes de dizer que o deploy deu certo.
            for i in \$(seq 1 40); do
              estado=\$(docker inspect --format '{{.State.Health.Status}}' condominio-backend-1 2>/dev/null || echo ausente)
              echo \"health do backend: \$estado\"
              if [ \"\$estado\" = healthy ]; then exit 0; fi
              if [ \"\$estado\" = ausente ]; then
                echo 'Container nem existe - o compose falhou. Logs:'
                docker logs --tail 40 condominio-backend-1 2>&1 || true
                exit 1
              fi
              if [ \"\$estado\" = unhealthy ]; then
                echo 'Container subiu mas reprovou no healthcheck. Logs:'
                docker logs --tail 60 condominio-backend-1 2>&1 || true
                exit 1
              fi
              sleep 10
            done
            echo 'Nao ficou healthy em ~7 minutos. Ultimos logs:'
            docker logs --tail 60 condominio-backend-1 2>&1 || true
            exit 1
          "

      # O passo anterior ja provou que a aplicacao esta de pe (healthcheck da imagem, que
      # so passa depois do Flyway migrar e o Spring atender). O que ainda nao foi provado e
      # o caminho publico: DNS -> certificado -> router do Traefik -> middleware. E isso que
      # este passo cobre. 401 e a resposta CERTA aqui: significa que o Traefik casou o
      # router de api.* e aplicou o basic auth. Qualquer outro codigo indica DNS errado,
      # certificado nao emitido ou router mal configurado.
      - name: Conferir o caminho publico (DNS + TLS + Traefik)
        run: |
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.romtechsolucoes.com.br/v3/api-docs || true)
            echo "tentativa $i: HTTP $codigo"
            if [ "$codigo" = "401" ]; then
              echo "OK - Traefik roteando api.romtechsolucoes.com.br com basic auth."
              exit 0
            fi
            sleep 10
          done
          echo "Nao obtive 401 em 5 minutos. Suspeitos: registro A de api.* ausente,"
          echo "certificado Let's Encrypt nao emitido, ou middleware swagger-auth@file faltando."
          exit 1
